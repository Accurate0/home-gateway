name: Branch build eink-display-firmware

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - eink-display-firmware/**
      - proto/eink/**
      - .forgejo/workflows/branch-build-eink-display-firmware.yaml

jobs:
  build:
    name: Build
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://github.com/esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7
        with:
          buildtargets: esp32s3
          ldproxy: true
      - name: Install protoc
        run: apt-get update && apt-get install -y protobuf-compiler
      - name: Build
        run: cargo build --release
        working-directory: eink-display-firmware
        env:
          HOME_GATEWAY_API_KEY: ${{ secrets.HOME_GATEWAY_API_KEY || 'placeholder' }}
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'placeholder' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'placeholder' }}
