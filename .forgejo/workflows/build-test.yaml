name: Build and test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - migrations/**
      - .sqlx/**
      - config/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - Dockerfile.postgres
      - .forgejo/workflows/build-test.yaml

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: fmt + clippy
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y pkg-config libssl-dev cmake gcc nasm \
            protobuf-compiler libprotobuf-dev libde265-dev
      - uses: https://github.com/dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: https://github.com/Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: docker
    env:
      POSTGRES_CONTAINER: home-gateway-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y pkg-config libssl-dev cmake gcc nasm \
            protobuf-compiler libprotobuf-dev libde265-dev
      - uses: https://github.com/dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: https://github.com/Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Build the TimescaleDB image
        run: docker build -f Dockerfile.postgres -t home-gateway-postgres:ci .

      - name: Start the database
        run: |
          docker rm -f "$POSTGRES_CONTAINER" 2>/dev/null || true
          docker run -d --name "$POSTGRES_CONTAINER" \
            -p 5432 \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=home \
            home-gateway-postgres:ci \
            postgres -c shared_preload_libraries=timescaledb

          port=$(docker port "$POSTGRES_CONTAINER" 5432/tcp | head -1 | sed 's/.*://')
          echo "DATABASE_URL=postgres://postgres:test@localhost:${port}/home" >> "$GITHUB_ENV"

          for _ in $(seq 1 60); do
            docker exec "$POSTGRES_CONTAINER" pg_isready -h 127.0.0.1 -U postgres && exit 0
            sleep 2
          done

          echo "database did not become ready" >&2
          docker logs "$POSTGRES_CONTAINER" >&2
          exit 1

      - name: Install cargo-binstall
        uses: https://github.com/cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0

      - name: Install sqlx-cli
        run: cargo binstall --no-confirm --locked --disable-strategies compile sqlx-cli@0.9.0
        env:
          GITHUB_TOKEN: ""

      - name: Check the offline query cache matches the schema
        env:
          SQLX_OFFLINE: "false"
        run: |
          cargo sqlx migrate run
          cargo sqlx prepare --check -- --all-targets

      - run: cargo test --workspace

      - name: Remove the database
        if: always()
        run: docker rm -f "$POSTGRES_CONTAINER" || true
