name: Build and test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - migrations/**
      - .sqlx/**
      - config/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - Dockerfile.postgres
      - .forgejo/workflows/build-test.yaml

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: fmt + clippy
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y pkg-config libssl-dev cmake gcc nasm \
            protobuf-compiler libprotobuf-dev libde265-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: docker
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y pkg-config libssl-dev cmake gcc nasm \
            protobuf-compiler libprotobuf-dev libde265-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the TimescaleDB image
        run: docker build -f Dockerfile.postgres -t home-gateway-postgres:ci .

      - name: Start the database
        run: |
          docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=home \
            home-gateway-postgres:ci \
            postgres -c shared_preload_libraries=timescaledb

          for _ in $(seq 1 60); do
            docker exec postgres pg_isready -U postgres && exit 0
            sleep 2
          done

          echo "database did not become ready" >&2
          docker logs postgres >&2
          exit 1

      - name: Check the offline query cache matches the schema
        env:
          SQLX_OFFLINE: "false"
        run: |
          cargo install sqlx-cli --locked --no-default-features --features postgres,rustls
          cargo sqlx migrate run
          cargo sqlx prepare --check -- --all-targets

      - run: cargo test --workspace
