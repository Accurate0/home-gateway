name: Deploy Web
on:
  push:
    branches:
      - main
    paths:
      - web/**
      - packages/**
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - .forgejo/workflows/deploy-web.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    uses: anurag/workflows/.forgejo/workflows/build-push-image.yaml@main
    with:
      directory: .
      image-name: home-gateway-web
      dockerfile: web/Dockerfile
