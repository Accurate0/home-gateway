name: Deploy Web
on:
  push:
    branches:
      - main
    paths:
      - web/**
      - packages/**
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - .forgejo/workflows/deploy-web.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    uses: anurag/workflows/.forgejo/workflows/build-push-image.yaml@main
    with:
      directory: .
      image-name: home-gateway-web
      dockerfile: web/Dockerfile

  deploy:
    needs:
      - build
    uses: anurag/workflows/.forgejo/workflows/deploy-image.yaml@main
    with:
      service-name: home-web
      images: registry.anurag.sh/containers/home-gateway-web
      manifests-path: projects/home-gateway
      values-file: projects/home-gateway/image.values.yaml
      tag: ${{ github.sha }}
    secrets:
      CI_IMAGE_UPDATER_TOKEN: ${{ secrets.CI_IMAGE_UPDATER_TOKEN }}
