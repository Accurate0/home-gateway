name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - migrations/**
      - .sqlx/**
      - Cargo.toml
      - Cargo.lock
      - config/**
      - Dockerfile
      - .forgejo/workflows/deploy.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    uses: anurag/workflows/.forgejo/workflows/build-push-image.yaml@main
    with:
      directory: .
      image-name: home-gateway
      build-args: |
        BINARY_NAME=home-gateway
    secrets:
      SECRET_BUILD_ARGS: HOME_GATEWAY_API_SECRET=${{ secrets.HOME_GATEWAY_API_SECRET }}

  deploy:
    needs:
      - build
    uses: anurag/workflows/.forgejo/workflows/deploy-image.yaml@main
    with:
      service-name: home-gateway
      images: registry.anurag.sh/containers/home-gateway
      manifests-path: projects/home-gateway
      values-file: projects/home-gateway/image.values.yaml
      tag: ${{ github.sha }}
    secrets:
      CI_IMAGE_UPDATER_TOKEN: ${{ secrets.CI_IMAGE_UPDATER_TOKEN }}
