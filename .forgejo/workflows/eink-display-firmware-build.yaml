name: Eink Display Firmware Build

on:
  push:
    branches:
      - main
    paths:
      - "eink-display-firmware/**"
      - "proto/eink/**"
      - ".forgejo/workflows/eink-display-firmware-build.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: docker

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: https://github.com/esp-rs/xtensa-toolchain@7e0506d8fb6bb8b1e0c7f543d97d4edebaf33d22 # main
        with:
          buildtargets: esp32s3
          ldproxy: true
          github-token: ${{ secrets.READONLY_GH_TOKEN }}

      - name: Cache esp-idf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            eink-display-firmware/.embuild/espressif/dist
            eink-display-firmware/.embuild/espressif/esp-idf
            eink-display-firmware/.embuild/espressif/python_env
          key: ${{ runner.os }}-espidf-${{ hashFiles('eink-display-firmware/sdkconfig.defaults', 'eink-display-firmware/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-espidf-

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            eink-display-firmware/target/release
            eink-display-firmware/target/xtensa-esp32s3-espidf
          key: ${{ runner.os }}-firmware-cargo-${{ hashFiles('eink-display-firmware/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-firmware-cargo-${{ hashFiles('eink-display-firmware/Cargo.lock') }}-
            ${{ runner.os }}-firmware-cargo-

      - name: Install protoc
        run: apt-get update && apt-get install -y protobuf-compiler

      - name: Install cargo-binstall
        uses: https://github.com/cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0

      - name: Install cargo-espflash
        run: cargo binstall --no-confirm --locked cargo-espflash
        env:
          GITHUB_TOKEN: ""

      - name: Resolve version
        id: version
        run: |
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "version=v${CARGO_VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}/eink-display-firmware

      - name: Build and save flashable image
        run: |
          cargo espflash save-image \
            --release \
            --chip esp32s3 \
            firmware_${{ steps.version.outputs.version }}.bin
        working-directory: ${{ github.workspace }}/eink-display-firmware
        env:
          HOME_GATEWAY_API_KEY: ${{ secrets.HOME_GATEWAY_API_KEY }}
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}

      - name: Install AWS CLI
        run: |
          command -v aws && exit 0
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
          unzip -q awscliv2.zip
          ./aws/install
          rm -rf aws awscliv2.zip

      - name: Publish firmware
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
        run: |
          aws s3 cp \
            eink-display-firmware/firmware_${{ steps.version.outputs.version }}.bin \
            s3://home-gateway-bucket/eink-display/firmware/firmware_${{ steps.version.outputs.version }}.bin \
            --content-type application/octet-stream

  propose-rollout:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install jq and yq
        run: |
          apt-get update && apt-get install -y jq
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.48.1/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Configure Git
        run: |
          git config --global user.name "ci-image-updater"
          git config --global user.email "ci-image-updater@git.anurag.sh"

      - name: Clone Config Repo
        env:
          FORGEJO_TOKEN: ${{ secrets.CI_IMAGE_UPDATER_TOKEN }}
        run: |
          git clone https://x-access-token:${FORGEJO_TOKEN}@git.anurag.sh/anurag/home-gateway.git config-repo

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: config-repo/package.json

      - name: Update eink firmware version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd config-repo
          yq -i '.firmware_version = strenv(VERSION)' config/sections/eink_display.yaml
          pnpx prettier@3 --write config/sections/eink_display.yaml

      - name: Commit and Raise PR
        env:
          VERSION: ${{ needs.build.outputs.version }}
          FORGEJO_TOKEN: ${{ secrets.CI_IMAGE_UPDATER_TOKEN }}
        run: |
          cd config-repo
          PR_BRANCH="ci/update-eink-firmware-${VERSION}"
          TITLE_AND_COMMIT="chore(deploy): update eink-display-firmware to ${VERSION} [skip ci]"

          git checkout -b ${PR_BRANCH}
          git add config/sections/eink_display.yaml
          git commit -m "${TITLE_AND_COMMIT}" || { echo "No changes to commit"; exit 0; }
          git push -f origin ${PR_BRANCH}

          BODY=$(cat <<PREOF
          ## Firmware Rollout

          | Field | Value |
          |-------|-------|
          | **Version** | \`${VERSION}\` |
          | **Artifact** | \`eink-display/firmware/firmware_${VERSION}.bin\` |

          Merging this points every eink display at the new firmware. Each device picks it up on
          its next wake cycle, flashes to the inactive OTA slot, and reboots.

          **Triggered by:** [${{ github.repository }}@${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          PREOF
          )
          PAYLOAD=$(jq -n \
            --arg title "${TITLE_AND_COMMIT}" \
            --arg head "${PR_BRANCH}" \
            --arg base "main" \
            --arg body "${BODY}" \
            '{title: $title, head: $head, base: $base, body: $body}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            https://git.anurag.sh/api/v1/repos/anurag/home-gateway/pulls)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "PR created successfully"
            echo "$RESPONSE_BODY" | jq -r '.html_url'
          elif [ "$HTTP_CODE" -eq 409 ]; then
            echo "PR already exists for branch ${PR_BRANCH}"
          else
            echo "Failed to create PR (HTTP ${HTTP_CODE}):"
            echo "$RESPONSE_BODY"
            exit 1
          fi
