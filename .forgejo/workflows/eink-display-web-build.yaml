name: Eink Display Web Build

on:
  push:
    branches:
      - main
    paths:
      - "eink-display-web/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".forgejo/workflows/eink-display-web-build.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter eink-display-web...

      - name: Build
        run: pnpm --filter eink-display-web build
        env:
          VITE_GRAPHQL_API_KEY: ${{ secrets.EINK_DISPLAY_WEB_API_KEY }}

      - name: Install AWS CLI
        run: |
          command -v aws && exit 0
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
          unzip -q awscliv2.zip
          ./aws/install
          rm -rf aws awscliv2.zip

      - name: Publish index.html
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
        run: |
          aws s3 cp eink-display-web/dist/index.html \
            s3://home-gateway-bucket/eink-display/web/index.html \
            --content-type text/html
