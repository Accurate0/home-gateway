name: Publish home
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - ortzi.yaml
      - .forgejo/workflows/publish-cli-home.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: https://git.anurag.sh/anurag/workflows/setup-zigbuild@main
      - uses: https://git.anurag.sh/anurag/workflows/setup-ortzi@main
      - run: ortzi publish
