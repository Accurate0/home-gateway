name: Branch build eink-display-web

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - eink-display-web/**
      - packages/**
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/branch-build-eink-display-web.yml

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter eink-display-web...
      - name: Build
        run: pnpm --filter eink-display-web build
        env:
          VITE_GRAPHQL_API_KEY: "testing"
