name: Branch build home-gateway

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - src/**
      - tests/**
      - migrations/**
      - .sqlx/**
      - Cargo.toml
      - Cargo.lock
      - config/**
      - build.rs
      - Dockerfile
      - .github/workflows/branch-build-home-gateway.yml

jobs:
  test:
    name: Test
    uses: ./.github/workflows/build-test.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          build-args: |
            BINARY_NAME=home-gateway
          cache-from: type=gha,scope=home-gateway
