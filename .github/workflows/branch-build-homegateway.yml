name: Branch build HomeGateway

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "HomeGateway/**"
      - ".github/workflows/branch-build-homegateway.yml"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25.0.5+8.0.LTS"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Mock secrets file
        run: cp local.defaults.properties secrets.properties
        working-directory: HomeGateway
      - name: Build
        run: ./gradlew assembleDebug
        working-directory: HomeGateway
