query AdhocTasks {
  homeAdhocCronTasks {
    id
    name
    schedule
    flag
    nextRunAt
    lastRunAt
    durationMs
    rowsAffected
    outcome
  }
  homeAdhocTasks {
    id
    ordinal
    name
    flag
    completedAt
    durationMs
    pending
    checksumDrifted
  }
}

mutation RunAdhocCronTask($name: String!) {
  homeRunAdhocCronTask(name: $name)
}

mutation RunPendingAdhocTasks {
  homeRunPendingAdhocTasks
}
