query BatteryHistory($since: DateTime!) {
  homeEntities {
    __typename
    ... on HomeLightEntity {
      id
      name
      room
      battery {
        history(since: $since) {
          time
          batteryPercentage
        }
      }
    }
    ... on HomeDoorEntity {
      id
      name
      room
      battery {
        history(since: $since) {
          time
          batteryPercentage
        }
      }
    }
    ... on HomePresenceEntity {
      id
      name
      room
      battery {
        history(since: $since) {
          time
          batteryPercentage
        }
      }
    }
    ... on HomeEnvironmentEntity {
      id
      name
      room
      battery {
        history(since: $since) {
          time
          batteryPercentage
        }
      }
    }
    ... on HomeEinkDisplayEntity {
      id
      name
      room
      battery {
        history(since: $since) {
          time
          batteryPercentage
        }
      }
    }
    ... on HomeRobotVacuumEntity {
      id
      name
      room
      battery {
        history(since: $since) {
          time
          batteryPercentage
        }
      }
    }
    ... on HomeGarageDoorEntity {
      id
      name
      room
      battery {
        history(since: $since) {
          time
          batteryPercentage
        }
      }
    }
  }
}
