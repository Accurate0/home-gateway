mutation LightOn($id: IdOrAlias!) {
  light(id: $id) {
    on
  }
}

mutation LightOff($id: IdOrAlias!) {
  light(id: $id) {
    off
  }
}

mutation LightSetBrightness($id: IdOrAlias!, $value: Int!) {
  light(id: $id) {
    setBrightness(input: { value: $value })
  }
}

mutation LightSetColourTemperature($id: IdOrAlias!, $value: Int!) {
  light(id: $id) {
    setColourTemperature(input: { value: $value })
  }
}

mutation MediaPlayPause($id: IdOrAlias!) {
  mediaPlayer(id: $id) {
    playPause
  }
}

mutation MediaStop($id: IdOrAlias!) {
  mediaPlayer(id: $id) {
    stop
  }
}

mutation VacuumStart($id: IdOrAlias!) {
  robotVacuum(id: $id) {
    start
  }
}

mutation VacuumStop($id: IdOrAlias!) {
  robotVacuum(id: $id) {
    stop
  }
}

mutation VacuumDock($id: IdOrAlias!) {
  robotVacuum(id: $id) {
    dock
  }
}

mutation GarageDoorOpen($id: IdOrAlias!) {
  garageDoor(id: $id) {
    open
  }
}

mutation GarageDoorClose($id: IdOrAlias!) {
  garageDoor(id: $id) {
    close
  }
}

mutation AirPurifierTurnOn($id: IdOrAlias!) {
  airPurifier(id: $id) {
    turnOn
  }
}

mutation AirPurifierTurnOff($id: IdOrAlias!) {
  airPurifier(id: $id) {
    turnOff
  }
}

mutation AirPurifierSetMode($id: IdOrAlias!, $mode: AirPurifierMode!) {
  airPurifier(id: $id) {
    setMode(mode: $mode)
  }
}

mutation AirPurifierSetSpeed($id: IdOrAlias!, $speed: Int!) {
  airPurifier(id: $id) {
    setSpeed(speed: $speed)
  }
}

mutation AirPurifierSetDisplay($id: IdOrAlias!, $on: Boolean!) {
  airPurifier(id: $id) {
    setDisplay(on: $on)
  }
}

mutation EinkTakeScreenshot($id: IdOrAlias!) {
  einkDisplay(id: $id) {
    takeScreenshot
  }
}

mutation LightSetColour($id: IdOrAlias!, $hex: String!) {
  light(id: $id) {
    setColour(input: { hex: $hex })
  }
}

mutation LightColourTemperatureMove($id: IdOrAlias!, $value: Int!) {
  light(id: $id) {
    colourTemperatureMove(input: { value: $value })
  }
}
