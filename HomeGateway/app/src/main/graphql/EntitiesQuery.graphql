query Entities {
  homeEntitySections {
    category
    title
  }
  homeEntities {
    __typename
    ... on HomeLightEntity {
      category
      id
      name
      room
      capabilities
      on
    }
    ... on HomeDoorEntity {
      category
      id
      name
      room
      open
    }
    ... on HomePresenceEntity {
      category
      id
      name
      room
      present
    }
    ... on HomeEnvironmentEntity {
      category
      id
      name
      room
      temperature
      humidity
      pressure
      lux
      uvIndex
      pm25
      vocIndex
      lastSeen
    }
    ... on HomePlantEntity {
      category
      id
      name
      room
      soilMoisture
      battery {
        percentage
      }
    }
    ... on HomeEinkDisplayEntity {
      category
      id
      name
      room
      batteryPercentage
      isCharging
    }
    ... on HomeGarageDoorEntity {
      category
      id
      name
      room
      garageState: state
      battery {
        percentage
      }
    }
    ... on HomeAirPurifierEntity {
      category
      id
      name
      room
      on
      purifierMode: mode
      purifierSpeed: speed
      purifierPm25: pm25
      aqi
      cadr
      filterLife
      displayOn: display
    }
    ... on HomeLockableEntity {
      lock {
        source
        expiresAt
      }
    }
    ... on HomeRobotVacuumEntity {
      category
      id
      name
      room
      status
      batteryPercentage
      currentRoom
    }
    ... on HomeMediaPlayerEntity {
      category
      id
      name
      room
      playing
      appName
      mediaTitle
      mediaSeriesTitle
    }
  }
}
