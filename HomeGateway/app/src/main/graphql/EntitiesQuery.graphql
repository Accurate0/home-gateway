query Entities {
  entitySections {
    category
    title
  }
  entities {
    __typename
    ... on LightEntity {
      category
      id
      name
      room
      capabilities
      on
    }
    ... on DoorEntity {
      category
      id
      name
      room
      open
    }
    ... on PresenceEntity {
      category
      id
      name
      room
      present
    }
    ... on EnvironmentEntity {
      category
      id
      name
      room
      temperature
      humidity
      pressure
      lux
      uvIndex
      pm25
      vocIndex
      lastSeen
    }
    ... on PlantEntity {
      category
      id
      name
      room
      soilMoisture
      battery {
        percentage
      }
    }
    ... on EinkDisplayEntity {
      category
      id
      name
      room
      batteryPercentage
      isCharging
    }
    ... on GarageDoorEntity {
      category
      id
      name
      room
      garageState: state
      battery {
        percentage
      }
    }
    ... on AirPurifierEntity {
      category
      id
      name
      room
      on
      purifierMode: mode
      purifierSpeed: speed
      purifierPm25: pm25
      aqi
      cadr
      filterLife
      displayOn: display
    }
    ... on RobotVacuumEntity {
      category
      id
      name
      room
      status
      batteryPercentage
      currentRoom
    }
    ... on MediaPlayerEntity {
      category
      id
      name
      room
      playing
      appName
      mediaTitle
      mediaSeriesTitle
    }
  }
}
