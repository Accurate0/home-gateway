subscription Events {
  homeEvents(filter: "*") {
    __typename
    ... on HomeLightUpdate {
      id
      on
    }
    ... on HomeDoorUpdate {
      id
      open
    }
    ... on HomeGarageDoorUpdate {
      id
      garageState: state
    }
    ... on HomeAirPurifierUpdate {
      id
      on
      purifierMode: mode
      purifierSpeed: speed
      displayOn: display
    }
    ... on HomeDeviceLockUpdate {
      id
      locked
      source
      expiresAt
    }
    ... on HomePresenceUpdate {
      id
      present
    }
    ... on HomeEnvironmentUpdate {
      id
      readings {
        metric
        value
      }
    }
    ... on HomePlantUpdate {
      id
      soilMoisture
    }
    ... on HomeMediaPlayerUpdate {
      id
      appName
      mediaTitle
      mediaSeriesTitle
      state
    }
    ... on HomeDeviceConnectionUpdate {
      deviceId
      connected
    }
    ... on HomeCommandFailedUpdate {
      id
      kind
      attempts
    }
  }
}
