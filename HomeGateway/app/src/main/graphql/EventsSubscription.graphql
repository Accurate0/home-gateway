subscription Events {
  events(filter: "*") {
    __typename
    ... on LightUpdate {
      id
      on
    }
    ... on DoorUpdate {
      id
      open
    }
    ... on GarageDoorUpdate {
      id
      garageState: state
    }
    ... on PresenceUpdate {
      id
      present
    }
    ... on EnvironmentUpdate {
      id
      readings {
        metric
        value
      }
    }
    ... on PlantUpdate {
      id
      soilMoisture
    }
    ... on MediaPlayerUpdate {
      id
      appName
      mediaTitle
      mediaSeriesTitle
      state
    }
  }
}
