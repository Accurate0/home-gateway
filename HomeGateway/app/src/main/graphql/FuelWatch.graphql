query FuelSites {
  homeFuelwatch {
    sites(limit: 20) {
      siteId
      name
      brand
      suburb
      address
      price
      priceTomorrow
      latitude
      longitude
    }
  }
}

subscription FuelWatchUpdates {
  homeEvents(filter: "fuelwatch:*") {
    __typename
    ... on HomeFuelWatchUpdate {
      siteId
    }
  }
}
