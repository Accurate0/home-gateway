query HomeAssistantEntities {
  homeHomeAssistant {
    entities {
      id
      entityId
      state
      time
    }
  }
}

subscription HomeAssistantUpdates {
  homeEvents(filter: "home_assistant:*") {
    __typename
    ... on HomeHomeAssistantUpdate {
      id
      entityId
      state
    }
  }
}
