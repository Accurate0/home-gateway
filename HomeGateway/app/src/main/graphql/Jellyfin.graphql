query JellyfinSessions {
  homeJellyfin {
    nowPlaying {
      sessionId
      user
      device
      client
      itemName
      itemType
      seriesName
      season
      episode
      positionSeconds
      runtimeSeconds
      playMethod
      paused
    }
  }
}

subscription JellyfinUpdates {
  homeEvents(filter: "jellyfin:*") {
    __typename
    ... on HomeJellyfinUpdate {
      state
      sessionId
      user
      device
      client
      itemName
      itemType
      seriesName
      season
      episode
      positionSeconds
      runtimeSeconds
      playMethod
    }
  }
}
