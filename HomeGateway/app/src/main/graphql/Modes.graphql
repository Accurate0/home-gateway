query Modes {
  homeMode {
    active
    node(mode: VACATION) {
      mode
      ... on HomeVacationMode {
        enabled
        window
        jitter
        minObservations
        lights {
          address
          deviceId
          name
          coverage
          currentTarget
          actions {
            at
            on
            slot
            onFraction
          }
        }
      }
    }
  }
}

mutation SetMode($mode: HomeMode!) {
  homeSetMode(mode: $mode)
}
