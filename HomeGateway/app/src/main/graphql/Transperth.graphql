query TransperthRoutes {
  transperth {
    routes {
      id
      origin
      destination
      updatedAt
      stale
      departures {
        line
        headsign
        platform
        scheduledDeparture
        liveDeparture
        delayMinutes
        live
      }
    }
  }
}

subscription TransperthUpdates {
  events(filter: "transperth:*") {
    __typename
    ... on TransperthUpdate {
      routeId
    }
  }
}
