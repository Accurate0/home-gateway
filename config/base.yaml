# yaml-language-server: $schema=schemas/config.editor.schema.json
version: "1"

http: !include sections/http.yaml
mqtt: !include sections/mqtt.yaml
actors: !include sections/actors.yaml
auth: !include sections/auth.yaml
home_assistant: !include sections/home_assistant.yaml
jellyfin: !include sections/jellyfin.yaml
transperth: !include sections/transperth.yaml
eink_display: !include sections/eink_display.yaml

database:
  min_connections: 0
  max_connections: 10
  slow_statement_threshold: 6s

graphql:
  max_depth: 20
  max_complexity: 5000
  query_timeout: 10s

tracing:
  sampling:
    default: 1.0
    spans:
      mqtt.ingest: 0.05

s3:
  bucket: home-gateway-bucket
  region: ap-southeast-2

notify_targets:
  android_app:
    type: android_app

fcm_project_id: home-gateway-22

sun:
  catch_up_within: 2h

workflow:
  workers: 12
  enabled_cache:
    capacity: 1024
    ttl: 5m
  condition_timeout: 10s
  timers:
    catch_up_within: 10m

lua:
  timeout: 5s
  max_instructions: 5000000
  library: lua/lib
  scripts: lua/workflows

reconciler:
  enabled: true
  workers: 4
  interval: 5s
  grace: 3s
  backoff: 10s
  confirm_timeout: 5s
  max_attempts: 3
  batch_size: 64

watchdog:
  enabled: true
  timeout: 30m
  check_interval: 5m
  realert_after: 6h

woolworths:
  refresh: 1h

trmnl:
  refresh: 3h

alarm:
  poll_interval: 60s

willyweather:
  refresh: 1h
  days: 7
  default_location: perth
  locations:
    perth: "14576"

fuelwatch:
  refresh: 1h

holidays:
  url: https://calendar.google.com/calendar/ical/en-gb.australian%23holiday%40group.v.calendar.google.com/public/basic.ics
  refresh: 24h
  regions: [Western Australia]

solar:
  refresh: 1m

adhoc:
  recheck_interval: 15m
  task_timeout: 5m
  cron_jitter: 60s
  batch_size: 10000

vacation:
  enabled: true
  modes: [vacation]
  window: 672h
  jitter: 12m
  min_observations: 8
  seed: 20260908

zigbee_models: !include zigbee_models.yaml
devices: !include devices/index.yaml
workflows: !include workflows/index.yaml
