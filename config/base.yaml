version: "1"

s3:
  bucket: home-gateway-bucket
  region: ap-southeast-2

notify_targets:
  android_app:
    type: android_app

fcm_project_id: home-gateway-22

location:
  latitude: -31.952429
  longitude: 115.842283

sun:
  catch_up_within: 2h

workflow:
  workers: 12

watchdog:
  enabled: false
  timeout: 30m
  check_interval: 5m
  realert_after: 6h

oauth:
  issuer: https://idm.anurag.sh/oauth2/openid/home-gateway
  jwks_url: https://idm.anurag.sh/oauth2/openid/home-gateway/public_key.jwk
  userinfo_url: https://idm.anurag.sh/oauth2/openid/home-gateway/userinfo
  audience: home-gateway
  group_scopes:
    home_gateway_admins@idm.anurag.sh: ["*"]
    home_gateway_readers@idm.anurag.sh: ["graphql:*:read", "rest:epd:read"]

api_keys:
  - name: eink-display-living-room
    scopes: ["rest:epd:read"]
  - name: unifi-ingest
    scopes: ["ingest:unifi:write"]
  - name: home-gateway-app
    scopes: ["*"]
  - name: oled-remote
    scopes:
      - "graphql:entity:read"
      - "graphql:light:read"
      - "graphql:light:write"
      - "graphql:media_player:read"
      - "graphql:media_player:write"

woolworths:
  refresh: 1h

trmnl:
  refresh: 3h

alarm:
  poll_interval: 60s

willyweather:
  default_location: "14576"
  cache_ttl: 15m

transperth:
  refresh_peak: 3m
  refresh_off_peak: 15m
  horizon: 2h
  peak:
    - start: "06:00"
      end: "09:30"
    - start: "15:00"
      end: "18:30"
  routes:
    - id: aubin-grove-to-perth
      from: Aubin Grove Stn
      to: Perth Underground Stn
      limit: 3

home_assistant:
  url: http://home-assistant.internal
  entities:
    - id: sensor.apollo_mtr_1_living_room_target_*
      log: false
      throttle: 30s

jellyfin:
  url: http://jellyfin.media.internal
  poll_interval: 30s

solar:
  refresh: 1m

eink_display:
  views:
    home:
      query: view=home
    weather:
      query: view=weather
  albums:
    world:
      prefix: eink-display/album/world/
    cats:
      prefix: eink-display/album/cats/
  palette:
    black: { r: 0, g: 0, b: 0 }
    white: { r: 255, g: 255, b: 255 }
    yellow: { r: 255, g: 255, b: 0 }
    red: { r: 255, g: 0, b: 0 }
    blue: { r: 0, g: 0, b: 255 }
    green: { r: 0, g: 255, b: 0 }

adhoc:
  recheck_interval: 15m

zigbee_models: !include zigbee_models.yaml
devices: !include devices.yaml
workflows: !include workflows/index.yaml
