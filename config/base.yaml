# yaml-language-server: $schema=schemas/config.editor.schema.json
version: "1"

http: !include sections/http.yaml
mqtt: !include sections/mqtt.yaml
actors: !include sections/actors.yaml
adhoc: !include sections/adhoc.yaml
auth: !include sections/auth.yaml
home_assistant: !include sections/home_assistant.yaml
integrations: !include sections/integrations.yaml
eink_display: !include sections/eink_display.yaml
endpoints: !include sections/endpoints.yaml

database:
  min_connections: 0
  max_connections: 10
  slow_statement_threshold: 6s

graphql:
  max_depth: 20
  max_complexity: 5000
  query_timeout: 10s

tracing:
  sampling:
    default: 1.0
    spans:
      mqtt.ingest: 0.05
      home_assistant.ingest: 0.02
      db.intent.claim_due: 0.05

notify:
  targets:
    android_app:
      type: android_app
  disabled: []

fcm_project_id: home-gateway-22

sun:
  catch_up_within: 2h

workflow:
  workers: 12
  enabled_cache:
    capacity: 1024
    ttl: 5m
  condition_timeout: 10s
  timers:
    catch_up_within: 10m

lua:
  timeout: 5s
  max_instructions: 5000000
  max_memory: 67108864
  library: lua/lib
  scripts: lua/workflows
  model_library: lua/model_lib

reconciler:
  state: enabled
  workers: 4
  interval: 5s
  grace: 3s
  backoff: 10s
  confirm_timeout: 5s
  max_attempts: 3
  batch_size: 64

watchdog:
  state: enabled
  timeout: 30m
  check_interval: 5m
  realert_after: 6h

alarm:
  poll_interval: 60s

vacation:
  state: enabled
  modes: [vacation]
  window: 672h
  jitter: 12m
  min_observations: 8
  seed: 20260908

devices: !include devices/index.yaml
workflows: !include workflows/index.yaml
