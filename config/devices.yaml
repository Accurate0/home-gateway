- id: front-door
  room: entry
  transport: zigbee
  address: "0x54ef441000d2b0b0"
  watchdog:
    timeout: 1h
    notify: [android_app]
  roles:
    - type: door
      config:
        name: Front Door
        id: front-door
        state: armed
        timeout: 3m
        notify: [android_app]
    - type: battery

- id: garage-door
  room: garage
  transport: zigbee
  address: "0x54ef441000d2b1ba"
  roles:
    - type: door
      config:
        name: Garage Door
        id: garage-door
        state: unarmed
        notify: [android_app]
    - type: battery

- id: living-room-table-lamp
  room: living-room
  transport: zigbee
  address: "0xa4c1389fe5cea26e"
  roles:
    - type: smart_switch
      config:
        name: Living Room Table Lamp
        as: light

- id: env-living-room
  room: living-room
  transport: zigbee
  address: "0x00158d008b8798a7"
  roles:
    - type: environment
      config: { id: living-room, name: Living Room }
      capabilities: [temperature, humidity, pressure]
    - type: battery

- id: env-bathroom
  room: bathroom
  transport: zigbee
  address: "0x00158d008b879b53"
  roles:
    - type: environment
      config: { id: bathroom, name: Bathroom }
      capabilities: [temperature, humidity, pressure]
    - type: battery

- id: env-bedroom
  room: bedroom
  transport: zigbee
  address: "0xb0c7defffef6a9be"
  roles:
    - type: environment
      config: { id: bedroom, name: Bedroom }
      capabilities: [temperature, humidity, pressure]
    - type: battery

- id: env-outdoor
  room: outdoor
  transport: zigbee
  address: "0x54ef441000ee2ca3"
  roles:
    - type: environment
      config: { id: outdoor, name: Outdoor }
      capabilities: [temperature, humidity, pressure]
    - type: battery

- id: livingroom-motion
  room: living-room
  transport: esphome
  address: apollo-mtr-1-livingroom
  roles:
    - type: light
      config:
        name: Living Room MTR-1 RGB
        entity: rgb_light
      capabilities: [brightness, rgb]
    - type: presence
      config:
        name: Living Room Motion
        motion_entity:
          [ld2450_presence, ld2450_moving_target, ld2450_still_target]
    - type: environment
      config:
        id: living-room-mtr-1
        name: Living Room
        entities:
          temperature: dps310_temperature
          pressure: dps310_pressure
          lux: ltr390_light
      capabilities: [temperature, pressure, lux]

- id: closet-presence
  room: bedroom
  transport: zigbee
  address: "0x54ef441000dbc81c"
  roles:
    - type: presence
      config: { name: Closet Presence Sensor }

- id: hallway-plant
  room: hallway
  transport: esphome
  address: apollo-plt-1-hallway
  roles:
    - type: environment
      config:
        id: hallway-plant
        name: Hallway Plant
        entities:
          temperature: air_temperature
          humidity: air_humidity
          lux: ltr390_light
          uv_index: ltr390_uv_index
      capabilities: [temperature, humidity, lux, uv_index]
    - type: plant
      config: { id: hallway-plant, entities: [soil_moisture] }

- id: closet-light
  room: bedroom
  transport: zigbee
  address: "0x54ef441000d4f05c"
  roles:
    - type: light
      config: { name: Closet Light }
      capabilities: [brightness, colour_temp]

- id: table-lamp-bedroom
  room: bedroom
  transport: zigbee
  address: "0x001788010381ef5d"
  roles:
    - type: light
      config: { name: Bedroom Table Lamp }
      capabilities: [brightness, colour_temp, rgb]

- id: floor-lamp-living-room
  room: living-room
  transport: zigbee
  address: "0x94a081fffe2eedc0"
  roles:
    - type: light
      config: { name: Living Room Floor Lamp }
      capabilities: [brightness, colour_temp]

- id: control-switch
  transport: zigbee
  address: "0x64028ffffe638218"
  roles:
    - type: control_switch
    - type: battery

- id: small-switch
  transport: zigbee
  address: "0x00158d008bbe0316"
  roles:
    - type: control_switch
    - type: battery

- id: living-room-epd
  room: living-room
  transport: eink_display_firmware
  address: "94a990cf8384"
  roles:
    - type: eink_display_firmware
      config:
        name: Living Room Display
        firmware_version: v0.1.0-7246cef
        orientation: portrait
        refresh: 1h
        settle: 10s
        mode:
          name: dashboard
          view: home
        sleep:
          start: "00:00"
          end: "08:00"
    - type: battery

- id: hallway-epd
  room: hallway
  transport: eink_display_firmware
  address: "e83dc1fb1c98"
  roles:
    - type: eink_display_firmware
      config:
        name: Hallway Display
        firmware_version: v0.1.0-7246cef
        orientation: portrait
        refresh: 1h
        settle: 10s
        mode:
          name: dashboard
          view: home
        sleep:
          start: "00:00"
          end: "08:00"
    - type: battery

- id: fridge-trmnl
  room: kitchen
  transport: trmnl
  address: "653VZN"
  roles:
    - type: trmnl
      config:
        name: Fridge TRMNL
    - type: battery

- id: roborock
  room: dining-room
  transport: home_assistant
  address: vacuum.robot
  roles:
    - type: roborock
      config:
        name: Roborock
        status_entity: sensor.robot_status
        battery_entity: sensor.robot_battery
        room_entity: sensor.robot_current_room
        control_entity: vacuum.robot
        start_service: vacuum.start
        stop_service: vacuum.stop
        dock_service: vacuum.return_to_base
    - type: battery

- id: valetudo
  room: spare-room
  transport: valetudo
  address: rockrobo
  roles:
    - type: valetudo
      config:
        name: Vacuum
    - type: battery
