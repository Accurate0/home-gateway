# yaml-language-server: $schema=../schemas/devices.schema.json
- id: door-mccgq12lm-1
  aliases: [front-door]
  state: enabled
  room: entry
  transport:
    type: mqtt
    address: "0x54ef441000d2b0b0"
  model: aqara_mccgq12lm
  watchdog:
    notify: [android_app]
  roles:
    - type: door
      config:
        name: Front Door
        state: armed
        timeout: 3m
        notify: [android_app]

- id: door-mccgq12lm-2
  aliases: [garage-door]
  state: disabled
  room: garage
  transport:
    type: mqtt
    address: "0x54ef441000d2b1ba"
  model: aqara_mccgq12lm
  roles:
    - type: door
      config:
        name: Garage Door
        state: unarmed
        notify: [android_app]
    - type: battery
