# yaml-language-server: $schema=../devices.schema.json
- id: living-room-epd
  room: living-room
  transport: eink_display_firmware
  address: "e83dc1fb1c98"
  roles:
    - type: eink_display_firmware
      config:
        name: Living Room Display
        firmware_version: v0.1.0-a2c2e42
        orientation: portrait
        refresh: "0 */12 * * *"
        grace: 10m
        mode:
          name: reddit
          subreddit: EarthPorn
          timespan: day
          limit: 25
        partial:
          enabled: true
          max_area_pct: 45
          max_consecutive: 12
    - type: battery

- id: hallway-epd
  room: hallway
  transport: eink_display_firmware
  address: "94a990cf8384"
  roles:
    - type: eink_display_firmware
      config:
        name: Hallway Display
        firmware_version: v0.1.0-a2c2e42
        orientation: portrait
        refresh: "0 * * * *"
        grace: 10m
        mode:
          name: dashboard
          view: home
          settle: 10s
          lead: 15m
        sleep:
          start: "23:00"
          end: "08:00"
        partial:
          enabled: true
          max_area_pct: 45
          max_consecutive: 12
    - type: battery
