  room: bedroom
  transport:
    type: mqtt
    address: "0x54ef441000d4f05c"
  model: aqara_t1
  roles:
    - type: light
      config: { name: Closet Light }

- id: table-lamp-bedroom
  state: enabled
  room: bedroom
  transport:
    type: mqtt
    address: "0x001788010381ef5d"
  model: phillips_9290012573a
  roles:
    - type: light
      config: { name: Bedroom Table Lamp }

- id: floor-lamp-living-room
  state: enabled
  room: living-room
  transport:
    type: mqtt
    address: "0x94a081fffe2eedc0"
  model: ikea_led2201g8
  roles:
    - type: light
      config: { name: Living Room Floor Lamp }
