# yaml-language-server: $schema=../schemas/devices.schema.json
- id: living-room-tv
  state: enabled
  room: living-room
  transport: home_assistant
  address: media_player.living_room_tv
  model: media_player
  watchdog: { timeout: 12h }
  roles:
    - type: media_player
      config:
        name: Living Room TV
