# yaml-language-server: $schema=../schemas/devices.schema.json
- id: hallway-plant
  state: disabled
  room: hallway
  transport:
    type: mqtt
    address: apollo-plt-1-hallway
  model: apollo_plt_1
  watchdog: { timeout: 1h }
  roles:
    - type: environment
      config:
        id: hallway-plant
        name: Hallway Plant
    - type: plant
      config: { id: hallway-plant }
