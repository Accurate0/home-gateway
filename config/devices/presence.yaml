# yaml-language-server: $schema=../schemas/devices.schema.json
- id: livingroom-motion
  state: enabled
  room: living-room
  transport:
    type: esphome
    address: apollo-mtr-1-livingroom
  model: apollo_mtr_1
  watchdog: { timeout: 1h }
  roles:
    - type: light
      config:
        name: Living Room MTR-1 RGB
    - type: presence
      config:
        name: Living Room Motion
    - type: environment
      config:
        id: living-room-mtr-1
        name: Living Room

- id: closet-presence
  state: enabled
  room: bedroom
  transport:
    type: zigbee
    address: "0x54ef441000dbc81c"
  model: aqara_fp1e
  watchdog: { timeout: 1h }
  roles:
    - type: presence
      config: { name: Closet Presence Sensor }
