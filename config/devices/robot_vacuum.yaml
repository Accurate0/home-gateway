# yaml-language-server: $schema=../schemas/devices.schema.json
- id: vacuum-roborock-1
  aliases: [roborock]
  state: enabled
  room: dining-room
  transport:
    type: home_assistant
    address: vacuum.robot
  model: roborock
  roles:
    - type: robot_vacuum
      config:
        name: Roborock

- id: vacuum-rockrobo-1
  aliases: [valetudo]
  state: enabled
  room: spare-room
  transport:
    type: mqtt
    address: rockrobo
  model: valetudo
  roles:
    - type: robot_vacuum
      config:
        name: Vacuum
