# yaml-language-server: $schema=../schemas/devices.schema.json
- id: roborock
  state: enabled
  room: dining-room
  transport:
    type: home_assistant
    address: vacuum.robot
  model: roborock
  watchdog: { timeout: 7d }
  roles:
    - type: robot_vacuum
      config:
        name: Roborock
        start_service: vacuum.start
        stop_service: vacuum.stop
        dock_service: vacuum.return_to_base
    - type: battery

- id: valetudo
  state: enabled
  room: spare-room
  transport:
    type: valetudo
    address: rockrobo
  watchdog: { timeout: 7d }
  roles:
    - type: valetudo
      config:
        name: Vacuum
    - type: battery
