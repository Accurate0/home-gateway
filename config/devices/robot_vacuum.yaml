# yaml-language-server: $schema=../schemas/devices.schema.json
- id: roborock
  state: enabled
  room: dining-room
  transport: home_assistant
  address: vacuum.robot
  watchdog: { timeout: 12h }
  roles:
    - type: roborock
      config:
        name: Roborock
        status_entity: sensor.robot_status
        battery_entity: sensor.robot_battery
        room_entity: sensor.robot_current_room
        control_entity: vacuum.robot
        start_service: vacuum.start
        stop_service: vacuum.stop
        dock_service: vacuum.return_to_base
    - type: battery

- id: valetudo
  state: enabled
  room: spare-room
  transport: valetudo
  address: rockrobo
  watchdog: { timeout: 12h }
  roles:
    - type: valetudo
      config:
        name: Vacuum
    - type: battery
