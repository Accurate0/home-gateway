apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-gateway
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: home-gateway-config
    files:
      - base.yaml
  - name: home-gateway-config-sections
    files:
      - sections/actors.yaml
      - sections/adhoc.yaml
      - sections/auth.yaml
      - sections/eink_display.yaml
      - sections/endpoints.yaml
      - sections/home_assistant.yaml
      - sections/http.yaml
      - sections/integrations.yaml
      - sections/mqtt.yaml
  - name: home-gateway-config-devices
    files:
      - devices/index.yaml
      - devices/control_switch.yaml
      - devices/door.yaml
      - devices/eink_display.yaml
      - devices/environment.yaml
      - devices/light.yaml
      - devices/media_player.yaml
      - devices/plant.yaml
      - devices/presence.yaml
      - devices/robot_vacuum.yaml
      - devices/smart_switch.yaml
      - devices/trmnl.yaml
  - name: home-gateway-config-workflows
    files:
      - workflows/index.yaml
      - workflows/alarm.yaml
      - workflows/bins.yaml
      - workflows/closet-presence.yaml
      - workflows/control-switch.yaml
      - workflows/eink-battery.yaml
      - workflows/forecast.yaml
      - workflows/fuel.yaml
      - workflows/holidays.yaml
      - workflows/living-room-lamp.yaml
      - workflows/movie-night.yaml
      - workflows/living-room-plant.yaml
      - workflows/rain.yaml
      - workflows/small-switch.yaml
      - workflows/solar.yaml
      - workflows/unifi-offline.yaml
      - workflows/woolworths.yaml
  - name: home-gateway-config-lua-lib
    files:
      - lua/lib/format.lua
      - lua/lib/lights.lua
  - name: home-gateway-config-lua-model-lib
    files:
      - lua/model_lib/esphome_light.lua
      - lua/model_lib/zigbee_light.lua
      - lua/model_lib/zigbee_switch.lua
  - name: home-gateway-config-lua-workflows
    files:
      - lua/workflows/brief.lua
      - lua/workflows/buttons.lua
      - lua/workflows/prices.lua
      - lua/workflows/reminders.lua
  - name: home-gateway-config-lua-mqtt
    files:
      - lua/mqtt/apollo_mtr_1.lua
      - lua/mqtt/apollo_plt_1.lua
      - lua/mqtt/apollo_plt_1b.lua
      - lua/mqtt/aqara_fp1e.lua
      - lua/mqtt/aqara_mccgq12lm.lua
      - lua/mqtt/aqara_t1.lua
      - lua/mqtt/aqara_wsdcgq12lm.lua
      - lua/mqtt/aqara_wxkg11lm.lua
      - lua/mqtt/ikea_e2001.lua
      - lua/mqtt/ikea_e2112.lua
      - lua/mqtt/ikea_led2201g8.lua
      - lua/mqtt/lumi_wsdcgq11lm.lua
      - lua/mqtt/phillips_9290012573a.lua
      - lua/mqtt/ts011f_plug.lua
      - lua/mqtt/valetudo.lua
  - name: home-gateway-config-lua-home-assistant
    files:
      - lua/home_assistant/media_player.lua
      - lua/home_assistant/roborock.lua
  - name: home-gateway-config-lua-esphome-native-api
    files:
      - lua/esphome_native_api/apollo_cast_1.lua
  - name: home-gateway-dashboard
    files:
      - dashboards/home-gateway.json
    options:
      labels:
        inf-k8s.net/grafana-dashboard: "true"
