# yaml-language-server: $schema=../schemas/config.editor.schema.json#/$defs/AdhocSettings
recheck_interval: 15m
task_timeout: 5m
cron_jitter: 60s
batch_size: 10000
tasks:
  refresh_public_holidays:
    state: enabled
    schedule: "0 4 1 * *"
    parameters: {}
  refresh_transperth_timetable:
    state: enabled
    schedule: "20 3 * * *"
    parameters: {}
  sample_light_state:
    state: enabled
    schedule: "*/5 * * * *"
    parameters: {}
  trim_device_intent:
    state: enabled
    schedule: "50 3 * * *"
    parameters:
      retention: 14d
  trim_workflow_runs:
    state: enabled
    schedule: "45 3 * * *"
    parameters:
      retention: 90d
