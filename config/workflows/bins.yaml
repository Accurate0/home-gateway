- name: Bins
  slug: bins
  group: Reminders
  on: { type: cron, schedule: "0 19 * * THU" }
  modes: [home, away, guest]
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "Bins"
      acknowledge: { remind_after: 2h, reminders: 1 }
      actions:
        - { label: Done, action: { type: acknowledge } }

- name: Bring Bins Back
  slug: bring-bins-back
  group: Reminders
  on: { type: cron, schedule: "0 12 * * FRI" }
  modes: [home, away, guest]
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "Bring the bins back in"
      acknowledge: { remind_after: 2h, reminders: 1 }
      actions:
        - { label: Done, action: { type: acknowledge } }
