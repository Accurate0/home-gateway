# yaml-language-server: $schema=../workflows.schema.json
- name: weather-forecast
  slug: weather-forecast
  group: Weather
  context: [willyweather]
  inputs: {}
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "${willyweather.today.emoji} ${willyweather.today.description}, ${willyweather.today.min}–${willyweather.today.max}°C. Rain ${willyweather.today.rain_probability | default(\"n/a\")}% (${willyweather.today.rain_range | default(\"n/a\")}mm), wind up to ${willyweather.today.wind_max_speed | int | default(\"n/a\")}km/h, UV ${willyweather.today.uv | round(1) | default(\"n/a\")}, sunset ${willyweather.today.sunset | default(\"n/a\")}"

- name: Morning Forecast
  slug: morning-forecast
  group: Weather
  on: { type: cron, schedule: "0 9 * * *" }
  modes: [home, away]
  run:
    - type: run_workflow
      workflow: weather-forecast
      with: {}
