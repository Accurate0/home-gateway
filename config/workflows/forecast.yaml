# yaml-language-server: $schema=../schemas/workflows.schema.json
- name: weather-forecast
  slug: weather-forecast
  group: Weather
  context: [willyweather]
  inputs: {}
  run:
    - type: lua
      call: brief.morning
      returns: { message: string }
    - type: notify
      notify: { type: android_app }
      category: general
      message: "${lua.message}"

- name: Morning Forecast
  slug: morning-forecast
  group: Weather
  on: { type: cron, schedule: "0 9 * * *" }
  modes: [home, away]
  run:
    - type: run_workflow
      workflow: weather-forecast
      with: {}
