# yaml-language-server: $schema=../schemas/workflows.schema.json
- name: Fuel Tuesday
  slug: fuel-tuesday
  group: Fuel
  on: { type: cron, schedule: "0 13 * * TUE" }
  context: [fuelwatch]
  modes: [home, away]
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "Cheapest ULP91 near ${fuelwatch.suburb}: ${fuelwatch.price | round(1)}c/L at ${fuelwatch.brand} ${fuelwatch.name}"
