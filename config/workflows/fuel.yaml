# yaml-language-server: $schema=../schemas/workflows.schema.json
- name: Fuel Tuesday
  slug: fuel-tuesday
  group: Fuel
  on: { type: cron, schedule: "0 13 * * TUE" }
  modes: [home, away]
  run:
    - type: lua
      call: prices.cheapest_fuel
      returns: { message: string }
    - type: notify
      notify: { type: android_app }
      category: general
      message: "${lua.message}"
