- name: Living room plant moisture check
  slug: living-room-plant-moisture-check
  group: Plants
  on: { type: cron, schedule: "0 19 * * WED" }
  modes: [home, away, guest]
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "Check the living room plant's soil moisture"

- name: Living room plant water and fertilise
  slug: living-room-plant-water-fertilise
  group: Plants
  on: { type: cron, schedule: "0 9 * * SUN" }
  modes: [home, away, guest]
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "Water and fertilise the living room plant"
