# yaml-language-server: $schema=../schemas/workflows.schema.json
- name: Bedroom purifier night
  slug: bedroom-purifier-night
  group: Bedroom
  tags: [bedroom, bedroom-purifier]
  on: { type: cron, schedule: "30 21 * * *" }
  modes: [home, away, guest]
  run:
    - type: lua
      call: purifier.night
      returns: {}
      args:
        - device: bedroom-purifier

- name: Bedroom purifier morning
  slug: bedroom-purifier-morning
  group: Bedroom
  tags: [bedroom, bedroom-purifier]
  on: { type: cron, schedule: "0 7 * * *" }
  modes: [home, away, guest]
  run:
    - type: lua
      call: purifier.morning
      returns: {}
      args:
        - device: bedroom-purifier

- name: Bedroom purifier on high PM2.5
  slug: bedroom-purifier-pm25
  group: Bedroom
  tags: [bedroom, bedroom-purifier]
  on: { type: air_purifier, device: bedroom-purifier, pm25: { op: gte, value: 14 } }
  when: { type: time_of_day, after: "07:00:00", before: "21:30:00" }
  modes: [home, away, guest]
  run:
    - type: lua
      call: purifier.auto
      returns: {}
      args:
        - device: bedroom-purifier

- name: Bedroom purifier filter low
  slug: bedroom-purifier-filter-low
  group: Reminders
  tags: [bedroom-purifier]
  on: { type: cron, schedule: "0 9 * * *" }
  modes: [home, away, guest]
  run:
    - type: lua
      call: reminders.filter_low
      returns: {}
      args:
        - device: bedroom-purifier
          name: Bedroom Purifier
          below: 10
