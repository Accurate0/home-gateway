# yaml-language-server: $schema=../schemas/workflows.schema.json
- name: Rain Today
  slug: rain-today
  group: Weather
  on: { type: weather, source: willyweather, metric: rain_probability, day: today, op: gte, value: 70 }
  cooldown: 12h
  modes: [home, away, guest]
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "Rain likely today: ${event.today.rain_probability | int}% chance"
