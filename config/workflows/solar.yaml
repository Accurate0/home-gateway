# yaml-language-server: $schema=../schemas/workflows.schema.json
- name: Solar Surplus
  slug: solar-surplus
  group: Energy
  on: { type: solar, metric: avg_15m, op: gt, value: 3000 }
  cooldown: 3h
  modes: [home, away]
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "Solar averaging ${event.avg_15m | int}W over the last 15 minutes (now ${event.current | int}W)"
