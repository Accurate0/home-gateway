- name: Woolworths Price Drop
  slug: woolworths-price-drop
  group: Shopping
  on: { type: woolworths }
  modes: [home, away, guest]
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "${name} dropped to $${new_price} (was $${old_price}, -$${drop})"
