# yaml-language-server: $schema=../schemas/workflows.schema.json
- name: Woolworths Price Drop
  slug: woolworths-price-drop
  group: Shopping
  on: { type: woolworths }
  modes: [home, away, guest]
  run:
    - type: notify
      notify: { type: android_app }
      category: general
      message: "${event.name} dropped to $${event.new_price | round(2)} (was $${event.old_price | round(2)}, -$${event.drop | round(2)})"
