services:
  home-gateway:
    build:
      dockerfile: Dockerfile
      args:
        - BINARY_NAME=home-gateway
    ports:
      - "8000:8000"
    links:
      - "db:database"
    depends_on:
      - db
      - s3-bucket
    environment:
      - DATABASE_URL=postgres://postgres:test@database/home
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - INTEGRATIONS__S3__ENDPOINT=http://s3:9000
    env_file:
      - .env.local
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 90s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 1s

  db:
    build:
      dockerfile: Dockerfile.postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries='timescaledb'
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: home
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 90s
      timeout: 5s
      retries: 5

  s3:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
    volumes:
      - s3data:/data
    environment:
      RUSTFS_ACCESS_KEY: home-gateway
      RUSTFS_SECRET_KEY: home-gateway-local

  s3-bucket:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    restart: on-failure
    environment:
      AWS_ACCESS_KEY_ID: home-gateway
      AWS_SECRET_ACCESS_KEY: home-gateway-local
      AWS_REGION: ap-southeast-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket home-gateway-bucket
        || aws --endpoint-url http://s3:9000 s3 mb s3://home-gateway-bucket

volumes:
  pgdata:
  s3data:
