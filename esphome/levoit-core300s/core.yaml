substitutions:
  name: levoit-core300s
  version: "2026.09.11"
  device_description: ${name} running tuct/levoit - version ${version}.
  rx_pin: GPIO16
  tx_pin: GPIO17

esphome:
  name_add_mac_suffix: false
  project:
    name: "tuct.levoit-core300s"
    version: "${version}"
  min_version: 2026.5.3

logger:
  level: VERBOSE

ota:
  - platform: esphome
    id: ota_esphome

safe_mode:

packages:
  network: !include ../common/network.yaml
  api: !include ../common/api.yaml

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y

external_components:
  - source:
      type: git
      url: https://github.com/tuct/levoit
      ref: ac0cffa15f43810412487fe32d914991fe0b1b1e
    components: [levoit]

wifi:
  power_save_mode: none
  output_power: 15dB

debug:
  update_interval: 5s

uart:
  - id: uart_mcu2esp
    tx_pin:
      number: ${tx_pin}
      inverted: false
    rx_pin:
      number: ${rx_pin}
      inverted: false
    baud_rate: 115200

levoit:
  id: levoitcore300
  model: CORE300S

fan:
  - platform: levoit
    levoit: levoitcore300
    name: "Fan"
    id: levoit_fan1

switch:
  - platform: levoit
    levoit: levoitcore300
    name: "Display"
    type: display
  - platform: levoit
    levoit: levoitcore300
    name: "Child Lock"
    type: child_lock

number:
  - platform: levoit
    levoit: levoitcore300
    name: "Timer (min)"
    type: timer
  - platform: levoit
    levoit: levoitcore300
    name: "Auto Mode Room Size"
    type: efficiency_room_size
  - platform: levoit
    levoit: levoitcore300
    name: "Auto Mode Room Size Preset"
    type: auto_profile_room_size_input
    min_value: 9
    max_value: 50
  - platform: levoit
    levoit: levoitcore300
    name: "Filter Months"
    type: filter_lifetime_months

sensor:
  - platform: levoit
    levoit: levoitcore300
    name: "AQ - PM 2.5"
    type: pm25
  - platform: levoit
    levoit: levoitcore300
    name: "AQI"
    type: aqi
  - platform: levoit
    levoit: levoitcore300
    name: "Current CADR"
    type: current_cadr
  - platform: levoit
    levoit: levoitcore300
    name: "Filter %"
    type: filter_life_left
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    min_free:
      name: "Heap Min Free"
    fragmentation:
      name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time"
    cpu_frequency:
      name: "CPU Frequency"

select:
  - platform: levoit
    levoit: levoitcore300
    name: "Fan Operating Mode"
    type: fan_operating_mode
  - platform: levoit
    levoit: levoitcore300
    name: "Auto Mode"
    type: auto_mode

text_sensor:
  - platform: levoit
    levoit: levoitcore300
    name: "MCU Version"
    type: mcu_version
  - platform: levoit
    levoit: levoitcore300
    name: "ESP Version"
    type: esp_version
  - platform: levoit
    levoit: levoitcore300
    name: "Timer Duration"
    type: timer_duration_initial
  - platform: levoit
    levoit: levoitcore300
    name: "Timer Remaining"
    type: timer_duration_remaining
  - platform: levoit
    levoit: levoitcore300
    name: "Error"
    type: error_message
  - platform: debug
    device:
      name: "Device Info"
      entity_category: diagnostic
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic

button:
  - platform: levoit
    levoit: levoitcore300
    name: "Filter Reset"
    type: reset_filter_stats

binary_sensor:
  - platform: levoit
    levoit: levoitcore300
    name: "Filter Low"
    type: filter_low
