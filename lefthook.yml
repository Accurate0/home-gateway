pre-commit:
  commands:
    cargo-fmt:
      priority: 1
      glob: "*.rs"
      run: cargo fmt --all --check

    cargo-clippy:
      priority: 2
      glob: "{*.rs,Cargo.toml,Cargo.lock,build.rs,.sqlx/*.json,config/*.yaml,config/**/*.yaml}"
      env:
        SQLX_OFFLINE: "true"
      run: cargo clippy --workspace --all-targets -- -D warnings
