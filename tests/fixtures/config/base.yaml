version: "1"

# Real deployments inject these from the environment; the tests need the
# settings to resolve without one.
api_key: ""
database_url: postgres://postgres:test@127.0.0.1:5432/home
mqtt:
  url: 127.0.0.1
  port: 1883
  username: ""
  password: ""
  keep_alive: 5s
  max_packet_size: 100000
  channel_capacity: 100
  reconnect:
    min: 1s
    max: 60s

database:
  min_connections: 0
  max_connections: 10
  slow_statement_threshold: 6s

http:
  listen_address: "[::]:8000"
  clients:
    default:
      timeout: 30s

graphql:
  max_depth: 20
  max_complexity: 5000
  query_timeout: 10s

actors:
  restart:
    backoff_base: 1s
    backoff_max: 60s
    healthy_after: 5m
  workers:
    mqtt_ingest: 5
    control_switch: 3
    door_sensor: 1
    environment_sensor: 1
    light: 1
    media_player: 1
    plant_sensor: 1
    presence_sensor: 1
    robot_vacuum: 2
    smart_switch: 3

tracing:
  sampling:
    default: 1.0
    spans: {}

s3:
  bucket: home-gateway-bucket
  region: ap-southeast-2

notify_targets:
  android_app:
    type: android_app

fcm_project_id: home-gateway-22

location:
  latitude: -31.952429
  longitude: 115.842283

sun:
  catch_up_within: 2h

lua:
  timeout: 5s
  max_instructions: 1000000
  max_memory: 67108864

ingest:
  sources:
    - name: test-doorbell
      script: |
        local body = json.decode(raw)
        mqtt.publish("test/ingest/doorbell", json.encode({ event = body.event }), false)

endpoints:
  routes:
    - path: /test/plain
      method: GET
      script: |
        return { room = "kitchen", warm = true }

    - path: /test/envelope
      method: GET
      script: |
        return {
          status = 201,
          headers = { ["x-source"] = "lua" },
          body = { created = true },
        }

    - path: /test/text
      method: GET
      script: |
        return { body = "pong" }

    - path: /test/scoped
      method: GET
      scopes: [light:read]
      script: |
        return { allowed = true }

    - path: /test/params
      method: GET
      params:
        hours: int
        room: string?
      script: |
        return { hours = request.query.hours, room = request.query.room }

    - path: /test/rooms/{room}/summary
      method: GET
      script: |
        return { room = request.params.room, path = request.path }

    - path: /test/echo
      method: POST
      body:
        name: string
        count: int?
      script: |
        return { name = request.json.name, raw = request.body }

    - path: /test/anything
      method: POST
      script: |
        return { got = request.json }

    - path: /test/graphql
      method: GET
      script: |
        local data = gw.graphql("query { workflows { slug } }")

        return { count = #data.workflows }

    - path: /test/mutation
      method: GET
      script: |
        return gw.graphql("mutation { executeLua(script: \"return 1\") }")

    - path: /test/subscription
      method: GET
      script: |
        return gw.graphql("subscription { events { kind } }")

    - path: /test/light
      method: GET
      script: |
        return { visible = light ~= nil and light.is_on ~= nil }

    - path: /test/weather
      method: GET
      scopes: [weather:read]
      script: |
        local today = weather.today()

        if today == nil then
          return { stored = false }
        end

        return { stored = true, max = today.max, emoji = today.emoji }

    - path: /test/weather-elsewhere
      method: GET
      scopes: [weather:read]
      script: |
        return weather.today("atlantis")

    - path: /test/fuel
      method: GET
      scopes: [fuelwatch:read]
      script: |
        local sites = fuel.cheapest(6164, 2)
        local names = {}

        for _, site in ipairs(sites) do
          table.insert(names, site.name)
        end

        return { names = names }

    - path: /test/fuel-default
      method: GET
      scopes: [fuelwatch:read]
      script: |
        return { sites = fuel.cheapest() }

    - path: /test/notify-actions
      method: POST
      scopes: [push:write]
      script: |
        notify.send({
          message = "the back door is open",
          category = "door",
          tag = "test-actions",
          actions = {
            { label = "Snooze", action = { type = "snooze", seconds = 600 } },
            { label = "Go away", action = { type = "dismiss" } },
          },
        })

        return { sent = true }

    - path: /test/notify-acknowledge
      method: POST
      scopes: [push:write]
      script: |
        notify.send({
          message = "take the bins out",
          category = "general",
          acknowledge = { remind_after = "10m", reminders = 3 },
          actions = {
            { label = "Done", action = { type = "acknowledge" } },
          },
        })

        return { sent = true }

    - path: /test/notify-unpaired
      method: POST
      scopes: [push:write]
      script: |
        notify.send({
          message = "unpaired",
          category = "general",
          acknowledge = { remind_after = "10m", reminders = 3 },
        })

        return { sent = true }

    - path: /test/notify-unknown-workflow
      method: POST
      scopes: [push:write]
      script: |
        notify.send({
          message = "bad target",
          category = "general",
          actions = {
            { label = "Run", action = { type = "run_workflow", workflow = "no-such-workflow" } },
          },
        })

        return { sent = true }

    - path: /test/boom
      method: GET
      script: |
        error("this endpoint always fails")

    - path: /test/slow
      method: GET
      script: |
        gw.sleep(30)

        return { done = true }

workflow:
  workers: 12
  enabled_cache:
    capacity: 1024
    ttl: 5m
  condition_timeout: 10s
  timers:
    catch_up_within: 10m

reconciler:
  enabled: true
  workers: 2
  interval: 100ms
  grace: 0s
  backoff: 100ms
  confirm_timeout: 2s
  max_attempts: 2
  batch_size: 64

watchdog:
  enabled: false
  timeout: 30m
  check_interval: 5m
  realert_after: 6h

auth:
  api_key_cache:
    capacity: 1024
    ttl: 1h
  api_keys:
    - name: test-reader
      scopes: ["epd:read"]
    - name: test-admin
      scopes: ["**:*"]

woolworths:
  refresh: 1h

trmnl:
  refresh: 3h

alarm:
  poll_interval: 60s

holidays:
  url: http://127.0.0.1:9/holidays.ics
  regions: [Western Australia]

willyweather:
  api_key: test
  refresh: 1h
  days: 7
  default_location: perth
  locations:
    perth: "14576"

home_assistant:
  websocket:
    keep_alive: 30s
    silence_timeout: 90s
    reconnect_delay: 5s

solar:
  refresh: 1m

eink_display:
  prepare_render_timeout: 15s
  defaults:
    reddit_limit: 25
    settle: 10s
    fallback_refresh: 15m
    min_refresh: 60s
  views:
    home:
      query: view=home
    weather:
      query: view=weather
  albums:
    world:
      prefix: eink-display/album/world/
    cats:
      prefix: eink-display/album/cats/
  palette:
    black: { r: 0, g: 0, b: 0 }
    white: { r: 255, g: 255, b: 255 }
    yellow: { r: 255, g: 255, b: 0 }
    red: { r: 255, g: 0, b: 0 }
    blue: { r: 0, g: 0, b: 255 }
    green: { r: 0, g: 255, b: 0 }

adhoc:
  recheck_interval: 15m
  task_timeout: 5m
  cron_jitter: 60s
  batch_size: 10000
  tasks:
    refresh_public_holidays:
      state: enabled
      schedule: "0 4 1 * *"
      parameters: {}
    refresh_transperth_timetable:
      state: enabled
      schedule: "20 3 * * *"
      parameters: {}
    sample_light_state:
      state: enabled
      schedule: "*/5 * * * *"
      parameters: {}
    trim_derived_door_events:
      state: enabled
      schedule: "0 3 * * *"
      parameters:
        retention: 8760h
    trim_device_intent:
      state: enabled
      schedule: "50 3 * * *"
      parameters:
        retention: 336h
    trim_device_metric:
      state: enabled
      schedule: "15 3 * * *"
      parameters:
        retention: 4320h
    trim_door_sensor:
      state: enabled
      schedule: "5 3 * * *"
      parameters:
        retention: 8760h
    trim_home_assistant_events:
      state: enabled
      schedule: "25 3 * * *"
      parameters:
        retention: 2160h
    trim_jellyfin_playback_events:
      state: enabled
      schedule: "35 3 * * *"
      parameters:
        retention: 4320h
    trim_light_history:
      state: enabled
      schedule: "50 3 * * *"
      parameters:
        retention: 2160h
    trim_robot_vacuum_events:
      state: enabled
      schedule: "40 3 * * *"
      parameters:
        retention: 4320h
    trim_smart_switch:
      state: enabled
      schedule: "30 3 * * *"
      parameters:
        retention: 4320h
    trim_temperature_sensor:
      state: enabled
      schedule: "20 3 * * *"
      parameters:
        retention: 4320h
    trim_workflow_runs:
      state: enabled
      schedule: "45 3 * * *"
      parameters:
        retention: 2160h

vacation:
  enabled: true
  modes: [vacation]
  window: 672h
  jitter: 12m
  min_observations: 8
  seed: 20260908

zigbee_models: lua/zigbee
devices: !include devices/index.yaml
workflows: !include workflows/index.yaml
