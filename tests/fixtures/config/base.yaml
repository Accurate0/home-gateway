version: "1"

# Real deployments inject these from the environment; the tests need the
# settings to resolve without one.
api_key: ""
database_url: postgres://postgres:test@127.0.0.1:5432/home
mqtt:
  url: 127.0.0.1
  port: 1883
  username: ""
  password: ""
  keep_alive: 5s
  max_packet_size: 100000
  channel_capacity: 100
  reconnect:
    min: 1s
    max: 60s

database:
  min_connections: 0
  max_connections: 10
  slow_statement_threshold: 6s

http:
  listen_address: "[::]:8000"
  clients:
    default:
      timeout: 30s

graphql:
  max_depth: 20
  max_complexity: 5000
  query_timeout: 10s

actors:
  restart:
    backoff_base: 1s
    backoff_max: 60s
    healthy_after: 5m
  workers:
    mqtt_ingest: 5
    control_switch: 3
    door_sensor: 1
    environment_sensor: 1
    light: 1
    media_player: 1
    plant_sensor: 1
    presence_sensor: 1
    robot_vacuum: 2
    smart_switch: 3

tracing:
  sampling:
    default: 1.0
    spans: {}

s3:
  bucket: home-gateway-bucket
  region: ap-southeast-2

notify_targets:
  android_app:
    type: android_app

fcm_project_id: home-gateway-22

location:
  latitude: -31.952429
  longitude: 115.842283

sun:
  catch_up_within: 2h

lua:
  timeout: 5s
  max_instructions: 1000000

ingest:
  sources:
    - name: test-doorbell
      script: |
        local body = json.decode(raw)
        mqtt.publish("test/ingest/doorbell", json.encode({ event = body.event }), false)

workflow:
  workers: 12
  enabled_cache:
    capacity: 1024
    ttl: 5m
  condition_timeout: 10s
  timers:
    catch_up_within: 10m

reconciler:
  enabled: true
  workers: 2
  interval: 100ms
  grace: 0s
  backoff: 100ms
  confirm_timeout: 2s
  max_attempts: 2
  batch_size: 64

watchdog:
  enabled: false
  timeout: 30m
  check_interval: 5m
  realert_after: 6h

auth:
  api_key_cache:
    capacity: 1024
    ttl: 1h
  api_keys:
    - name: test-reader
      scopes: ["epd:read"]
    - name: test-admin
      scopes: ["**:*"]

woolworths:
  refresh: 1h

trmnl:
  refresh: 3h

alarm:
  poll_interval: 60s

holidays:
  url: http://127.0.0.1:9/holidays.ics
  refresh: 24h
  regions: [Western Australia]

willyweather:
  api_key: test
  refresh: 1h
  days: 7
  default_location: perth
  locations:
    perth: "14576"

home_assistant:
  websocket:
    keep_alive: 30s
    silence_timeout: 90s
    reconnect_delay: 5s

solar:
  refresh: 1m

eink_display:
  prepare_render_timeout: 15s
  defaults:
    reddit_limit: 25
    settle: 10s
    fallback_refresh: 15m
    min_refresh: 60s
  views:
    home:
      query: view=home
    weather:
      query: view=weather
  albums:
    world:
      prefix: eink-display/album/world/
    cats:
      prefix: eink-display/album/cats/
  palette:
    black: { r: 0, g: 0, b: 0 }
    white: { r: 255, g: 255, b: 255 }
    yellow: { r: 255, g: 255, b: 0 }
    red: { r: 255, g: 0, b: 0 }
    blue: { r: 0, g: 0, b: 255 }
    green: { r: 0, g: 255, b: 0 }

adhoc:
  recheck_interval: 15m
  task_timeout: 5m
  cron_jitter: 60s
  batch_size: 10000

vacation:
  enabled: true
  modes: [vacation]
  window: 672h
  jitter: 12m
  min_observations: 8
  seed: 20260908

zigbee_models: !include zigbee_models.yaml
devices: !include devices/index.yaml
workflows: !include workflows/index.yaml
