- id: test-door
  state: enabled
  room: entry
  transport:
    type: mqtt
    address: "0x0000000000000001"
  model: test_door
  roles:
    - type: door
      config:
        name: Test Door
        id: test-door
        state: unarmed
        notify: [android_app]
    - type: battery

- id: test-environment
  state: enabled
  room: living-room
  transport:
    type: mqtt
    address: "0x0000000000000002"
  model: test_environment
  roles:
    - type: environment
      config: { id: test-room, name: Test Room }
    - type: battery

- id: test-lamp
  state: enabled
  room: living-room
  transport:
    type: mqtt
    address: "0x0000000000000003"
  model: test_plug
  roles:
    - type: smart_switch
      config:
        name: Test Lamp
        as: light

- id: test-presence
  state: enabled
  room: living-room
  transport:
    type: mqtt
    address: "0x0000000000000004"
  model: test_presence
  roles:
    - type: presence
      config: { name: Test Motion }

- id: test-esphome-environment
  state: enabled
  room: study
  transport:
    type: mqtt
    address: test-node
  model: test_node
  roles:
    - type: environment
      config:
        id: test-study
        name: Test Study

- id: test-speaker
  state: enabled
  room: study
  transport:
    type: esphome_native_api
    address: test-speaker.iot
  model: test_speaker
  roles:
    - type: media_player
      config: { name: Test Speaker }
