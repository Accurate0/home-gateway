- id: door-test-1
  aliases: [test-door]
  state: enabled
  room: entry
  transport:
    type: mqtt
    address: "0x0000000000000001"
  model: test_door
  roles:
    - type: door
      config:
        name: Test Door
        state: unarmed
        notify: [android_app]
    - type: battery

- id: env-test-1
  aliases: [test-environment]
  state: enabled
  room: living-room
  transport:
    type: mqtt
    address: "0x0000000000000002"
  model: test_environment
  roles:
    - type: environment
      config: { name: Test Room }
    - type: battery

- id: plug-test-1
  aliases: [test-lamp]
  state: enabled
  room: living-room
  transport:
    type: mqtt
    address: "0x0000000000000003"
  model: test_plug
  roles:
    - type: smart_switch
      config:
        name: Test Lamp
        as: light

- id: presence-test-1
  aliases: [test-presence]
  state: enabled
  room: living-room
  transport:
    type: mqtt
    address: "0x0000000000000004"
  model: test_presence
  roles:
    - type: presence
      config: { name: Test Motion }

- id: env-testnode-1
  aliases: [test-esphome-environment]
  state: enabled
  room: study
  transport:
    type: mqtt
    address: test-node
  model: test_node
  roles:
    - type: environment
      config:
        name: Test Study

- id: media-testspeaker-1
  aliases: [test-speaker]
  state: enabled
  room: study
  transport:
    type: esphome_native_api
    address: test-speaker.iot
  model: test_speaker
  roles:
    - type: media_player
      config: { name: Test Speaker }

- id: display-testpanel-1
  aliases: [test-panel]
  state: enabled
  room: study
  transport:
    type: eink_display_firmware
    address: "0000000000e1"
  watchdog: { timeout: 26h }
  roles:
    - type: eink_display_firmware
      config:
        name: Test Panel
        orientation: portrait
        refresh: "0 */12 * * *"
        grace: 30m
        mode:
          name: reddit
          subreddit: EarthPorn
          timespan: day
          limit: 25
        partial:
          state: disabled
          max_area_pct: 45
          max_consecutive: 12
