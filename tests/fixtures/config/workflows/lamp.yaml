- name: test-lamp-on
  slug: test-lamp-on
  group: Test
  run:
    - type: light
      device: test-lamp
      state: ON

- name: Test lamp on when door opens
  slug: test-door-opens-lamp-on
  group: Test
  on: { type: door, device: test-door, open: true }
  modes: [home]
  run:
    - type: run_workflow
      workflow: test-lamp-on

- name: Test lamp off when motion clears
  slug: test-motion-clear-lamp-off
  group: Test
  on: { type: presence, sensor: test-presence, present: false }
  modes: [home]
  run:
    - type: light
      device: test-lamp
      state: OFF

- name: Test lamp on when presence holds
  slug: test-presence-held-lamp-on
  group: Test
  on: { type: presence, sensor: test-presence, present: true }
  for: 1s
  modes: [home]
  run:
    - type: light
      device: test-lamp
      state: ON

- name: Test switch step drives the lamp
  slug: test-switch-step
  group: Test
  on: { type: door, device: test-door, open: false }
  modes: [home]
  run:
    - type: switch
      device: test-lamp
      state: ON
